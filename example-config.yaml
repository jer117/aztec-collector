---
# Aztec Collector Configuration
# All settings can be overridden with environment variables
# Format: AZTEC_COLLECTOR_<SECTION>_<KEY>
# Example: AZTEC_COLLECTOR_PROTOCOL_RPC_URL=http://my-node:8080

protocol:
  # Protocol name
  name: "aztec"
  # Public RPC URL for the Aztec node
  # Env: AZTEC_COLLECTOR_PROTOCOL_RPC_URL
  rpc_url: "http://localhost:8080"
  # Admin RPC URL (optional, for admin operations)
  # Env: AZTEC_COLLECTOR_PROTOCOL_ADMIN_URL
  admin_url: "http://localhost:8880"

# Sample collection interval
# Env: AZTEC_COLLECTOR_INTERVAL
interval: 30s

# HTTP API configuration
api:
  # Enable the control-plane HTTP server
  # Env: AZTEC_COLLECTOR_API_ENABLED
  enabled: true
  # Listen address for HTTP server
  # Only expose this API to trusted control plane infrastructure
  # Env: AZTEC_COLLECTOR_API_LISTEN
  listen: "0.0.0.0:13285"

# Health check configuration
health:
  # Minimum peer count to consider the node healthy
  # Env: AZTEC_COLLECTOR_HEALTH_MIN_PEERS
  min_peers: 0
  # Maximum blocks behind reference before considering the node unhealthy
  # Env: AZTEC_COLLECTOR_HEALTH_MAX_BLOCKS_BEHIND
  max_blocks_behind: 0
  # Maximum blocks ahead of reference before considering the node unhealthy
  # Env: AZTEC_COLLECTOR_HEALTH_MAX_BLOCKS_AHEAD
  max_blocks_ahead: 10

# JSON log output configuration
jsonlog:
  # Path to write JSON state output
  # Env: AZTEC_COLLECTOR_JSONLOG_PATH
  path: ./aztec-collector.json

# Reference service configuration for comparing block height
# Use this to compare your node against an external reference
ref_service:
  # Enable reference service
  # Env: AZTEC_COLLECTOR_REF_SERVICE_ENABLED
  enabled: false

  # Option 1: Use an HTTP reference service
  # Env: AZTEC_COLLECTOR_REF_SERVICE_URL
  url: ""
  # Protocol name for the reference service
  # Env: AZTEC_COLLECTOR_REF_SERVICE_PROTOCOL
  protocol: "aztec"
  # Network name for the reference service
  # Env: AZTEC_COLLECTOR_REF_SERVICE_NETWORK
  network: "mainnet"

  # Option 2: Use another Aztec node's RPC as reference
  # Env: AZTEC_COLLECTOR_REF_SERVICE_USE_EXTERNAL_RPC
  use_external_rpc: false
  # External Aztec node RPC URL to use as reference
  # Env: AZTEC_COLLECTOR_REF_SERVICE_EXTERNAL_RPC_URL
  external_rpc_url: ""

  # Request timeout for reference queries
  # Env: AZTEC_COLLECTOR_REF_SERVICE_TIMEOUT
  timeout: 5s

# --- Example configurations ---

# Example: Using another Aztec node as reference
# ref_service:
#   enabled: true
#   use_external_rpc: true
#   external_rpc_url: "http://public-aztec-rpc.example.com:8080"
#   timeout: 5s

# Example: Using an HTTP reference service
# ref_service:
#   enabled: true
#   url: "https://ref.height.systems"
#   protocol: "aztec"
#   network: "mainnet"
#   timeout: 5s

# Validator monitoring configuration
# Monitor your validator for missed attestations/proposals
validator:
  # Enable validator monitoring
  # Env: AZTEC_COLLECTOR_VALIDATOR_ENABLED
  enabled: false
  # Your validator address (lowercase)
  # Env: AZTEC_COLLECTOR_VALIDATOR_ADDRESS
  address: ""
  # Alert when attestations are missed
  # Env: AZTEC_COLLECTOR_VALIDATOR_ALERT_ON_MISSED_ATTESTATION
  alert_on_missed_attestation: true
  # Alert when block proposals are missed
  # Env: AZTEC_COLLECTOR_VALIDATOR_ALERT_ON_MISSED_PROPOSAL
  alert_on_missed_proposal: true

# --- Example validator configuration ---
# validator:
#   enabled: true
#   address: "0x04784a359ac474e8814a9f8fbf7590d2eb5267ee"
#   alert_on_missed_attestation: true
#   alert_on_missed_proposal: true

# Alerting configuration
# Send alerts when node health thresholds are breached
alerting:
  # Enable/disable alerting globally
  # Env: AZTEC_COLLECTOR_ALERTING_ENABLED
  enabled: false
  # Cooldown between alerts of the same type (prevents spam)
  # Env: AZTEC_COLLECTOR_ALERTING_COOLDOWN
  cooldown: 5m
  # Node name to include in alerts for identification
  # Env: AZTEC_COLLECTOR_ALERTING_NODE_NAME
  node_name: "my-aztec-node"

  # Slack webhook configuration
  slack:
    # Env: AZTEC_COLLECTOR_ALERTING_SLACK_ENABLED
    enabled: false
    # Env: AZTEC_COLLECTOR_ALERTING_SLACK_WEBHOOK_URL
    webhook_url: ""
    # Optional: override channel
    channel: ""
    # Optional: override username
    username: "Aztec Collector"

  # Discord webhook configuration
  discord:
    # Env: AZTEC_COLLECTOR_ALERTING_DISCORD_ENABLED
    enabled: false
    # Env: AZTEC_COLLECTOR_ALERTING_DISCORD_WEBHOOK_URL
    webhook_url: ""
    # Optional: bot username
    username: "Aztec Collector"
    # Optional: bot avatar URL
    avatar_url: ""

  # Telegram bot configuration
  telegram:
    # Env: AZTEC_COLLECTOR_ALERTING_TELEGRAM_ENABLED
    enabled: false
    # Env: AZTEC_COLLECTOR_ALERTING_TELEGRAM_BOT_TOKEN
    bot_token: ""
    # Env: AZTEC_COLLECTOR_ALERTING_TELEGRAM_CHAT_ID
    chat_id: ""

  # Generic webhook (for custom integrations like PagerDuty, Opsgenie, etc.)
  generic:
    # Env: AZTEC_COLLECTOR_ALERTING_GENERIC_ENABLED
    enabled: false
    # Env: AZTEC_COLLECTOR_ALERTING_GENERIC_WEBHOOK_URL
    webhook_url: ""
    # Optional: custom headers
    headers: {}
    # Optional: HTTP method (default: POST)
    method: "POST"

# --- Example alerting configurations ---

# Example: Slack alerting
# alerting:
#   enabled: true
#   cooldown: 5m
#   node_name: "prod-aztec-01"
#   slack:
#     enabled: true
#     webhook_url: "https://hooks.slack.com/services/TXXXXX/BXXXXX/your-webhook-token-here"
#     channel: "#alerts"

# Example: Discord alerting
# alerting:
#   enabled: true
#   cooldown: 5m
#   node_name: "prod-aztec-01"
#   discord:
#     enabled: true
#     webhook_url: "https://discord.com/api/webhooks/your-webhook-id/your-webhook-token"

# Example: Telegram alerting
# alerting:
#   enabled: true
#   cooldown: 5m
#   node_name: "prod-aztec-01"
#   telegram:
#     enabled: true
#     bot_token: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
#     chat_id: "-1001234567890"

