---
# Aztec Collector Configuration
# All settings can be overridden with environment variables
# Format: AZTEC_COLLECTOR_<SECTION>_<KEY>
# Example: AZTEC_COLLECTOR_PROTOCOL_RPC_URL=http://my-node:8080

protocol:
  # Protocol name
  name: "aztec"
  # Public RPC URL for the Aztec node
  # Env: AZTEC_COLLECTOR_PROTOCOL_RPC_URL
  rpc_url: "http://localhost:8080"
  # Admin RPC URL (optional, for admin operations)
  # Env: AZTEC_COLLECTOR_PROTOCOL_ADMIN_URL
  admin_url: "http://localhost:8880"

# Sample collection interval
# Env: AZTEC_COLLECTOR_INTERVAL
interval: 30s

# HTTP API configuration
api:
  # Enable the control-plane HTTP server
  # Env: AZTEC_COLLECTOR_API_ENABLED
  enabled: true
  # Listen address for HTTP server
  # Only expose this API to trusted control plane infrastructure
  # Env: AZTEC_COLLECTOR_API_LISTEN
  listen: "0.0.0.0:13285"

# Health check configuration
health:
  # Minimum peer count to consider the node healthy
  # Env: AZTEC_COLLECTOR_HEALTH_MIN_PEERS
  min_peers: 1
  # Maximum blocks behind reference before considering the node unhealthy
  # Env: AZTEC_COLLECTOR_HEALTH_MAX_BLOCKS_BEHIND
  max_blocks_behind: 100
  # Maximum blocks ahead of reference before considering the node unhealthy
  # Env: AZTEC_COLLECTOR_HEALTH_MAX_BLOCKS_AHEAD
  max_blocks_ahead: 10

# JSON log output configuration
jsonlog:
  # Path to write JSON state output
  # Env: AZTEC_COLLECTOR_JSONLOG_PATH
  path: ./aztec-collector.json

# Reference service configuration for comparing block height
# Use this to compare your node against an external reference
ref_service:
  # Enable reference service
  # Env: AZTEC_COLLECTOR_REF_SERVICE_ENABLED
  enabled: false

  # Option 1: Use an HTTP reference service
  # Env: AZTEC_COLLECTOR_REF_SERVICE_URL
  url: ""
  # Protocol name for the reference service
  # Env: AZTEC_COLLECTOR_REF_SERVICE_PROTOCOL
  protocol: "aztec"
  # Network name for the reference service
  # Env: AZTEC_COLLECTOR_REF_SERVICE_NETWORK
  network: "mainnet"

  # Option 2: Use another Aztec node's RPC as reference
  # Env: AZTEC_COLLECTOR_REF_SERVICE_USE_EXTERNAL_RPC
  use_external_rpc: false
  # External Aztec node RPC URL to use as reference
  # Env: AZTEC_COLLECTOR_REF_SERVICE_EXTERNAL_RPC_URL
  external_rpc_url: ""

  # Request timeout for reference queries
  # Env: AZTEC_COLLECTOR_REF_SERVICE_TIMEOUT
  timeout: 5s

# --- Example configurations ---

# Example: Using another Aztec node as reference
# ref_service:
#   enabled: true
#   use_external_rpc: true
#   external_rpc_url: "http://public-aztec-rpc.example.com:8080"
#   timeout: 5s

# Example: Using an HTTP reference service
# ref_service:
#   enabled: true
#   url: "https://ref.height.systems"
#   protocol: "aztec"
#   network: "mainnet"
#   timeout: 5s

# --- Docker Compose environment variable examples ---
# These can be set in your docker-compose.yml:
#
# environment:
#   - AZTEC_COLLECTOR_PROTOCOL_RPC_URL=http://aztec-node:8080
#   - AZTEC_COLLECTOR_PROTOCOL_ADMIN_URL=http://aztec-node:8880
#   - AZTEC_COLLECTOR_INTERVAL=30s
#   - AZTEC_COLLECTOR_API_LISTEN=0.0.0.0:13285
#   - AZTEC_COLLECTOR_REF_SERVICE_ENABLED=true
#   - AZTEC_COLLECTOR_REF_SERVICE_USE_EXTERNAL_RPC=true
#   - AZTEC_COLLECTOR_REF_SERVICE_EXTERNAL_RPC_URL=http://reference-node:8080
